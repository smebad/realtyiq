version: "3.9"

services:

  # FastAPI backend
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: realtyiq_api
    ports:
      - "8000:8000"
    volumes:
      # Mount data and models so they persist outside container
      - ../data:/app/data
      - ../models:/app/models
      - ../.env:/app/.env
    environment:
      - DATABASE_URL=sqlite:///./realtyiq.db
      - APP_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Streamlit frontend
  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: realtyiq_ui
    ports:
      - "8501:8501"
    volumes:
      - ../data:/app/data
      - ../models:/app/models
      - ../.env:/app/.env
    environment:
      - API_BASE=http://api:8000
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped