name: RealtyIQ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data pipeline tests
        run: pytest tests/test_data.py -v --tb=short

      - name: Run ML tests
        run: pytest tests/test_ml.py -v --tb=short

      - name: Run API tests
        run: pytest tests/test_api.py -v --tb=short

      - name: Check imports are clean
        run: |
          python -c "from src.data.loader import load_raw_data"
          python -c "from src.api.main import app"
          python -c "from src.rag.assistant import answer_question"
          echo "All imports OK"